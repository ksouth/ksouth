name: Profile cards

# Keeps the static cards in docs/cards/ current: PROFILE STATS and the 26-week
# commit graph, light and dark, 495x240. Plain SVG and public data only — no
# secrets, no dependencies. If collection fails the job writes nothing, so the
# committed cards keep their last good values.

on:
  schedule:
    # Twenty minutes after the dashboard job, so the three do not race for main.
    - cron: '20 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Regenerate the profile cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/profile-cards.mjs

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cards
          if git diff --cached --quiet; then
            echo "Nothing changed since the last run."
            exit 0
          fi
          git commit -m "chore: refresh profile cards"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          echo "::error::Could not push the refreshed cards after three attempts."
          exit 1
