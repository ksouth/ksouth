name: Created repositories page

# Keeps https://ksouth.github.io/ksouth/repos/created/ current: the repositories
# ksouth created, plus forks she has pushed work into, private ones included as
# metadata. Needs INVENTORY_TOKEN, a user token, because /user/repos refuses the
# built-in GITHUB_TOKEN with 403. Without the secret this job warns and leaves
# the last good page in place rather than publishing a public-only list.

on:
  schedule:
    # Ten minutes after the dashboard job, so the two do not race for main.
    - cron: '10 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: created-page
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Regenerate the created repositories page
        env:
          GH_TOKEN: ${{ secrets.INVENTORY_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_INVENTORY_TOKEN: ${{ secrets.INVENTORY_TOKEN != '' }}
        run: node scripts/created.mjs --out=docs/repos/created/index.html

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/repos/created data/created.json
          if git diff --cached --quiet; then
            echo "Nothing changed since the last run."
            exit 0
          fi
          git commit -m "chore: refresh created repositories page"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          echo "::error::Could not push the refreshed page after three attempts."
          exit 1
