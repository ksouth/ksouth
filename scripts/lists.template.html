<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>__TITLE__</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fff;
    --fg: #111;
    --muted: #6b6b6b;
    --rule: #e3e3e3;
    --strong: #c9c9c9;
    --accent: #0000C8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e0e;
      --fg: #e9e9e9;
      --muted: #9b9b9b;
      --rule: #2b2b2b;
      --strong: #3a3a3a;
      --accent: #1800F8;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  main { max-width: 900px; margin: 0 auto; padding: 28px 20px 56px; }
  header { padding-bottom: 15px; border-bottom: 1px solid var(--strong); }
  nav { margin-bottom: 12px; color: var(--muted); font-size: 12px; }
  nav a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--strong); }
  h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  h1 .owner-link, .byline a { color: var(--accent); }
  .byline { margin: 0 0 5px; color: var(--muted); font-size: 12px; }
  h2 { margin: 0 0 5px; font-size: 14px; font-weight: 600; }
  p { margin: 0; }
  .description, .count { color: var(--muted); }
  .description:empty { display: none; }
  .count { margin-top: 5px; font-size: 12px; }
  .repository-count { color: var(--accent); }
  .sort-controls { display: flex; align-items: center; gap: 8px; padding-top: 16px; }
  .sort-controls label, .field label { color: var(--muted); font-size: 12px; }
  select, input[type="search"] {
    min-height: 32px; padding: 5px 8px; border: 1px solid var(--strong); border-radius: 3px;
    background: var(--bg); color: var(--fg); font: inherit; font-size: 12px;
  }
  select:focus, input[type="search"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .see-also { margin-top: 6px; color: var(--muted); font-size: 12px; }
  .see-also a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--strong); }
  .list-rows { margin: 14px 0 0; padding: 0; list-style: none; }
  .list-row { padding: 9px 0; border-bottom: 1px solid var(--rule); }
  .list-row-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
  .list-name { color: var(--accent); font-size: 14px; font-weight: 550; text-decoration: none; border-bottom: 1px solid var(--rule); }
  .list-name:hover { border-bottom-color: var(--accent); }
  .list-count { color: var(--muted); font-size: 12px; }
  .list-description { margin-top: 2px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .repos { margin: 0; padding: 0; list-style: none; }
  .repos li { padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .repo { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
  .repo > a { color: var(--accent); font-size: 16px; font-weight: 550; text-decoration: none; border-bottom: 1px solid var(--strong); overflow-wrap: anywhere; }
  .repo > span { color: var(--muted); font-size: 14px; }
  .repo span a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--rule); }
  .repo-controls { display: grid; grid-template-columns: minmax(220px, 1fr) auto; gap: 10px; align-items: end; padding: 16px 0 10px; }
  .field { display: grid; gap: 4px; }
  .field input[type="search"] { width: 100%; }
  .repo-controls .field:last-of-type { min-width: 190px; }
  .result-count { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .repo-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 5px; color: var(--muted); font-size: 13px; }
  .repo-meta .stars { color: var(--fg); }
  .repo-item .description { margin-top: 4px; overflow-wrap: anywhere; font-size: 14px; }
  .topics { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .topic, .topic-more { padding: 1px 6px; border: 1px solid var(--accent); border-radius: 999px; background: transparent; color: var(--muted); font: inherit; font-size: 10px; line-height: 1.5; cursor: pointer; }
  .topic[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .topic-more { color: var(--accent); }
  .topic-hidden:not([hidden]) { display: flex; flex-basis: 100%; flex-wrap: wrap; gap: 4px; }
  .topic:focus-visible, .topic-more:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .empty { padding: 18px 0; color: var(--muted); }
  footer { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 11px; }
  footer a { color: var(--fg); }
  @media (max-width: 560px) {
    main { padding: 20px 14px 40px; }
    .repo-controls { grid-template-columns: 1fr; }
    .result-count { grid-column: 1; }
  }
</style>
</head>
<body>
<main>
  <header>
    __NAV__
    <h1>__HEADING__</h1>
__BYLINE__
    <p class="description">__DESCRIPTION__</p>
    <p class="count">__COUNT__</p>
__SEE_ALSO__
  </header>
  __CONTENT__
  <footer>Public repositories only · Updated __GENERATED_AT__ (Australia/Melbourne)</footer>
</main>
__SCRIPT__
</body>
</html>
